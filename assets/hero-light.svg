<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 338"
     width="1200" height="338" role="img" aria-label="Power BI, as source code">
  <style>
    /* Entrance animations move things but never fade them. A renderer that does
       not run CSS - GitHub's mobile app, an email digest, a PDF export - would
       otherwise show an empty banner, because the from-state of a fade is
       invisible and fill-mode `both` holds it for the whole delay. Every element
       here is fully legible with the animation stripped out. */
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    .sweep { animation: sweep .9s cubic-bezier(.2,.7,.3,1) .15s; }
    .blob  { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes sweep { from { width: 0 } to { width: 1120px } }
    @keyframes drift { from { transform: translate(0,0) }
                        to   { transform: translate(64px,-22px) } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Deliberately no background rect. GitHub has four surfaces - white,
       light-high-contrast, dark #0D1117 and dark dimmed #22272E - and any colour
       painted here is wrong on at least one of them. A transparent canvas is
       right on all four; the tiles and badges supply the structure a card
       would have. -->
  <g class="blob"><circle cx="1010" cy="70" r="240" fill="url(#g)"/></g>
  <text class="rise" x="40" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="800"
        fill="#1F2328" letter-spacing="-1">Power BI, as source code</text>
  <rect class="sweep" x="40" y="104" width="1120" height="2"
        rx="1" fill="#D0D7DE"/>
  <text class="rise" style="animation-delay:0.20s" x="40" y="132"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#656D76">A semantic model and report you can diff, a scripted month of synthetic data, and two tools that bulk-edit PBIR and TMDL files from a</text>
  <text class="rise" style="animation-delay:0.25s" x="40" y="156"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#656D76">CSV.</text>
  <g class="rise" style="animation-delay:0.35s">
    <rect x="40" y="184" width="362" height="86" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="40" y="184" width="4" height="86" rx="2" fill="#2563EB"/>
    <text x="62" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700"
          fill="#1F2328" letter-spacing="-0.5">4,894</text>
    <text x="62" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5"
          fill="#656D76">BigQuery jobs modelled, $662.98 attributed</text>
  </g>
  <g class="rise" style="animation-delay:0.46s">
    <rect x="418" y="184" width="362" height="86" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="418" y="184" width="4" height="86" rx="2" fill="#7C3AED"/>
    <text x="440" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700"
          fill="#1F2328" letter-spacing="-0.5">119</text>
    <text x="440" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5"
          fill="#656D76">field references repointed in one run</text>
  </g>
  <g class="rise" style="animation-delay:0.57s">
    <rect x="796" y="184" width="362" height="86" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="796" y="184" width="4" height="86" rx="2" fill="#0891B2"/>
    <text x="818" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700"
          fill="#1F2328" letter-spacing="-0.5">240</text>
    <text x="818" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5"
          fill="#656D76">TMDL fields documented from one CSV</text>
  </g>
  <g class="rise" style="animation-delay:0.85s">
    <rect x="40" y="292" width="128" height="24" rx="12"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="104" y="308" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#656D76">Power BI  ·  PBIP</text>
  </g>
  <g class="rise" style="animation-delay:0.92s">
    <rect x="178" y="292" width="42" height="24" rx="12"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="199" y="308" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#656D76">PBIR</text>
  </g>
  <g class="rise" style="animation-delay:0.99s">
    <rect x="231" y="292" width="42" height="24" rx="12"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="252" y="308" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#656D76">TMDL</text>
  </g>
  <g class="rise" style="animation-delay:1.06s">
    <rect x="283" y="292" width="155" height="24" rx="12"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="360" y="308" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#656D76">Python  ·  PowerShell</text>
  </g>
  <g class="rise" style="animation-delay:1.13s">
    <rect x="448" y="292" width="82" height="24" rx="12"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="489" y="308" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#656D76">Apache-2.0</text>
  </g>
</svg>
