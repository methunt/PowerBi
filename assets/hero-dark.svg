<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260"
     width="1200" height="260" role="img" aria-label="Power BI, as source code">
  <style>
    /* Entrance animations move things but never fade them. A renderer that does
       not run CSS - GitHub's mobile app, an email digest, a PDF export - would
       otherwise show an empty banner, because the from-state of a fade is
       invisible and fill-mode `both` holds it for the whole delay. Every element
       here is fully legible with the animation stripped out. */
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    .sweep { animation: sweep .9s cubic-bezier(.2,.7,.3,1) .15s; }
    .blob  { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes sweep { from { width: 0 } to { width: 1120px } }
    @keyframes drift { from { transform: translate(0,0) }
                        to   { transform: translate(64px,-22px) } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Deliberately no background rect. GitHub has four surfaces - white,
       light-high-contrast, dark #0D1117 and dark dimmed #22272E - and any colour
       painted here is wrong on at least one of them. A transparent canvas is
       right on all four; the tiles and badges supply the structure a card
       would have. -->
  <g class="blob"><circle cx="1010" cy="70" r="240" fill="url(#g)"/></g>
  <text class="rise" x="40" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="800"
        fill="#E6EDF3" letter-spacing="-1">Power BI, as source code</text>
  <rect class="sweep" x="40" y="116" width="1120" height="2"
        rx="1" fill="#30363D"/>
  <text class="rise" style="animation-delay:0.20s" x="40" y="148"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19.5" fill="#8B949E">Two dashboards that answer a real question, two tools that kill a hundred clicks — and every artefact kept as</text>
  <text class="rise" style="animation-delay:0.25s" x="40" y="176"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19.5" fill="#8B949E">text you can diff.</text>
  <g class="rise" style="animation-delay:0.85s">
    <rect x="40" y="206" width="167" height="32" rx="16"
          fill="#1C2128" stroke="#30363D"/>
    <text x="123" y="227" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">Power BI  ·  PBIP</text>
  </g>
  <g class="rise" style="animation-delay:0.92s">
    <rect x="217" y="206" width="58" height="32" rx="16"
          fill="#1C2128" stroke="#30363D"/>
    <text x="246" y="227" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">PBIR</text>
  </g>
  <g class="rise" style="animation-delay:0.99s">
    <rect x="284" y="206" width="58" height="32" rx="16"
          fill="#1C2128" stroke="#30363D"/>
    <text x="313" y="227" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">TMDL</text>
  </g>
  <g class="rise" style="animation-delay:1.06s">
    <rect x="352" y="206" width="200" height="32" rx="16"
          fill="#1C2128" stroke="#30363D"/>
    <text x="452" y="227" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">Python  ·  PowerShell</text>
  </g>
  <g class="rise" style="animation-delay:1.13s">
    <rect x="562" y="206" width="108" height="32" rx="16"
          fill="#1C2128" stroke="#30363D"/>
    <text x="616" y="227" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">Apache-2.0</text>
  </g>
</svg>
