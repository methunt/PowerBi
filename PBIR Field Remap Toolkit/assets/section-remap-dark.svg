<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140"
     width="1200" height="140" role="img" aria-label="Write the map, run it once">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="140" rx="12" fill="#161B22"/>
  <rect width="1200" height="140" rx="12" fill="url(#w)"/>
  <rect width="6" height="140" rx="3" fill="#8B5CF6"/>
  <g class="rise">
  <text x="40" y="34" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600"
        letter-spacing="1.4" fill="#8B5CF6">STEP 2</text>
  <text x="40" y="64" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#E6EDF3" letter-spacing="-0.4">Write the map, run it once</text>
  <text x="40" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5"
        fill="#8B949E">One mode, no flags to get wrong: the deep scan always runs and the changes are always written. Every change and every reference your map did not cover</text>
  <text x="40" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5"
        fill="#8B949E">is logged to CSV.</text>
  </g>
</svg>
