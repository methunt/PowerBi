<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 118"
     width="1200" height="118" role="img" aria-label="Inventory what is actually bound">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="118" rx="12" fill="#F6F8FA"/>
  <rect width="1200" height="118" rx="12" fill="url(#w)"/>
  <rect width="6" height="118" rx="3" fill="#0891B2"/>
  <g class="rise">
  <text x="40" y="34" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600"
        letter-spacing="1.4" fill="#0891B2">STEP 1</text>
  <text x="40" y="64" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#1F2328" letter-spacing="-0.4">Inventory what is actually bound</text>
  <text x="40" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5"
        fill="#656D76">Before you can rename anything you need the real list. One pass exports every semantic binding in the report, plus every scalar value, to CSV.</text>
  </g>
</svg>
